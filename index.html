<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>शायरी</title>
<meta name="theme-color" content="#ff2e79">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Hind:wght@400;500;600;700&family=Kalam&family=Noto+Serif+Devanagari&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff5fa;--card:#ffffff;--ink:#ff2e79;--soft:#c94b7d;--line:#f5cde0;
  --chip:#ffe6f2;--accent:#ff2e79;--g:linear-gradient(135deg,#ff2e79,#ff69b4);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#160814;--card:#240d21;--ink:#ff7eb6;--soft:#d47aa3;--line:#47183f;
  --chip:#33112e;--accent:#ff5ca8;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  background:radial-gradient(900px 520px at 90% -5%,rgba(255,46,121,.16),transparent 60%),
             radial-gradient(700px 520px at -10% 12%,rgba(255,105,180,.18),transparent 55%),
             var(--bg);
  background-attachment:fixed;
  color:var(--ink);
  font-family:"Hind",system-ui,sans-serif;
  font-size:16px;line-height:1.55;
  padding-bottom:92px;
}
.wrap{max-width:620px;margin:0 auto;padding:14px 16px 28px}

.top-header{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:4px 0 8px;
}
.brand-block{cursor:pointer;user-select:none}
.brand{
  font-family:"Tiro Devanagari Hindi",serif;font-size:1.85rem;font-weight:700;
  color:var(--accent);line-height:1.15;
}
.tagline{margin:2px 0 0;color:var(--soft);font-size:.88rem}

.top-icons{display:flex;align-items:center;gap:6px}
.t-icon{
  width:38px;height:38px;border-radius:12px;border:0;background:transparent;
  color:var(--accent);display:grid;place-items:center;cursor:pointer;padding:0;
}
.t-icon:active{background:var(--chip)}
.t-icon svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t-icon.moon svg{fill:currentColor;stroke:none}
.t-icon.grid-btn{background:rgba(255,46,121,.14);color:var(--accent)}
.t-icon.grid-btn[aria-expanded="true"]{background:var(--accent);color:#fff}
.t-icon.grid-btn svg{fill:currentColor;stroke:none;width:19px;height:19px}

.cat-drawer{
  display:none;background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:12px;margin-bottom:12px;box-shadow:0 10px 28px rgba(255,46,121,.12);
}
.cat-drawer.open{display:block}
.cat-drawer-head{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:10px;font-size:.9rem;font-weight:600;color:var(--soft);
}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat-tile{
  background:var(--chip);color:var(--accent);border:1px solid transparent;border-radius:14px;
  padding:9px 8px;font:inherit;font-size:.84rem;font-weight:600;cursor:pointer;
  text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cat-tile.active{background:var(--g);color:#fff}

.chips{
  display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
  margin:4px 0 12px;padding:6px 2px 8px;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;background:var(--card);color:var(--accent);border:1px solid var(--line);
  border-radius:20px;padding:7px 15px;font:inherit;font-size:.88rem;font-weight:600;
  cursor:pointer;box-shadow:0 2px 8px rgba(255,46,121,.06);
}
.chip[aria-pressed="true"]{
  background:var(--g);color:#fff;border-color:transparent;
  box-shadow:0 6px 16px -4px rgba(255,46,121,.45);
}

.story-strip{
  display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;padding:2px;
}
.story-strip::-webkit-scrollbar{display:none}
.st-chip{
  flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:6px 12px;font-size:.8rem;color:var(--accent);cursor:pointer;display:flex;align-items:center;gap:6px;
}

.search-wrap{
  display:none;margin-bottom:12px;background:var(--card);border:1px solid var(--line);
  border-radius:24px;padding:6px 12px;align-items:center;gap:8px;
}
.search-wrap.open{display:flex}
.search-wrap input{flex:1;border:0;background:none;color:var(--accent);font:inherit;outline:none}
.search-wrap button{border:0;background:var(--chip);color:var(--accent);border-radius:14px;padding:4px 10px;font:inherit;font-size:.82rem;cursor:pointer}

.hero{
  position:relative;min-height:250px;border-radius:22px;overflow:hidden;margin-bottom:14px;
  background-size:cover;background-position:center;color:#ff85bc;
  text-shadow:0 1px 6px rgba(0,0,0,.78);
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  padding:26px 20px;box-shadow:0 14px 36px -12px rgba(255,46,121,.45);
}
.hero::before{
  content:"";position:absolute;inset:12px;border:1px solid rgba(255,133,188,.5);
  border-radius:14px;pointer-events:none;
}
.hero p{
  position:relative;z-index:1;font-family:"Tiro Devanagari Hindi",serif;
  font-size:clamp(1.25rem,5.2vw,1.65rem);line-height:1.6;margin:0 0 12px;white-space:pre-line;cursor:pointer;
}
.hero .mood{
  position:relative;z-index:1;display:inline-block;background:rgba(0,0,0,.45);
  backdrop-filter:blur(6px);padding:3px 13px;border-radius:18px;font-size:.85rem;margin-bottom:14px;color:#ff9ecd;
}
.hero-row{position:relative;z-index:1;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
button.main{
  background:var(--g);color:#fff;border:0;border-radius:26px;padding:10px 22px;
  font:inherit;font-size:.92rem;font-weight:600;cursor:pointer;
  box-shadow:0 8px 20px -6px rgba(255,46,121,.65);
}
.pill-sec{
  background:rgba(255,255,255,.95);color:#ff2e79;border:0;border-radius:26px;
  padding:10px 18px;font:inherit;font-size:.9rem;font-weight:700;cursor:pointer;
}

.post{
  background:var(--card);border:1px solid var(--line);border-radius:24px;
  margin-bottom:16px;padding:12px;box-shadow:0 6px 22px rgba(255,46,121,.08);
}
.post-top{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 10px;gap:8px}
.p-user{display:flex;align-items:center;gap:10px;min-width:0}
.p-ava{width:38px;height:38px;border-radius:50%;border:2px dashed var(--accent);padding:2px;flex:0 0 auto;overflow:hidden}
.p-ava span,.p-ava img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.p-ava span{background:var(--g);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.95rem}
.p-name{font-weight:700;font-size:.96rem;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post-top-acts{display:flex;align-items:center;gap:6px}
.collab-btn{
  background:var(--chip);color:var(--accent);border:1.5px solid var(--accent);
  border-radius:16px;padding:4px 11px;font:inherit;font-size:.78rem;font-weight:700;cursor:pointer;
}
.mini-act{
  background:var(--chip);color:var(--accent);border:0;border-radius:14px;
  padding:4px 9px;font:inherit;font-size:.78rem;cursor:pointer;
}

.q-canvas{
  position:relative;min-height:280px;border-radius:18px;overflow:hidden;
  background-size:cover;background-position:center;
  display:flex;flex-direction:column;justify-content:center;padding:28px 22px;
  color:#ff69b4;text-shadow:0 1px 4px rgba(0,0,0,.72),0 2px 14px rgba(0,0,0,.5);
  cursor:pointer;
}
.q-canvas::before{content:"";position:absolute;inset:10px;border:1px solid rgba(255,105,180,.42);border-radius:12px;pointer-events:none}
.q-canvas p{position:relative;z-index:1;margin:0 0 12px;font-family:"Tiro Devanagari Hindi",serif;font-size:clamp(1.2rem,5vw,1.5rem);line-height:1.68;white-space:pre-line}
.q-canvas .q-sig{position:relative;z-index:1;font-size:.9rem;color:#ff9ecd}
.q-canvas .wm{position:absolute;left:16px;bottom:12px;font-size:.78rem;font-weight:600;opacity:.9;color:#ff85bc}

.post-meta{padding:10px 6px 4px}
.p-tags{color:var(--accent);font-size:.88rem;font-weight:600}
.p-time{color:var(--soft);font-size:.74rem}

.post-bar{display:flex;align-items:center;justify-content:space-between;padding-top:8px;margin-top:6px;border-top:1px solid var(--line);gap:4px}
.bar-left,.bar-right{display:flex;align-items:center;gap:5px}
.act{
  background:var(--chip);border:0;color:var(--accent);height:38px;min-width:38px;
  padding:0 10px;border-radius:19px;font:inherit;font-size:.9rem;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
}
.act[aria-pressed="true"]{background:var(--g);color:#fff;font-weight:600}

.cbox{margin-top:10px;padding:10px;border-radius:16px;display:grid;gap:8px;background:var(--bg);border:1px solid var(--line)}
.clist{display:grid;gap:6px;max-height:180px;overflow-y:auto}
.cm{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:.88rem;color:var(--accent)}
.cm b{color:var(--accent);font-size:.78rem;display:block}
.crow{display:flex;gap:8px}
.crow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--accent);border-radius:20px;padding:8px 14px;font:inherit;font-size:.92rem;outline:none}
.crow button{background:var(--g);color:#fff;border:0;border-radius:20px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer}

.side-jump{
  position:fixed;right:12px;top:50%;transform:translateY(-50%);z-index:35;
  display:flex;flex-direction:column;gap:10px;
}
.jump-btn{
  width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;
  font-size:1.15rem;font-weight:700;display:grid;place-items:center;
  box-shadow:0 6px 18px rgba(0,0,0,.22);
}
#jumpTop{background:var(--accent);color:#fff}
#jumpBottom{background:var(--card);color:var(--accent);border:1px solid var(--line)}

/* नीचे 💔 फ़ुटर बैज */
.bottom-heart-footer{
  text-align:center;font-size:1.5rem;padding:10px 0 6px;user-select:none;
}

.bnav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--card);border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-around;
  height:62px;padding-bottom:env(safe-area-inset-bottom,0px);
  box-shadow:0 -4px 16px rgba(255,46,121,.08);
}
.bnav button{background:none;border:0;color:var(--soft);font:inherit;font-size:.72rem;display:grid;place-items:center;gap:2px;cursor:pointer;min-width:56px}
.bnav button.active{color:var(--accent);font-weight:700}
.bnav button i{font-style:normal;font-size:1.25rem;line-height:1}
.bnav .plus-btn{
  width:52px;height:52px;border-radius:50%;background:var(--g);color:#fff;
  font-size:1.75rem;line-height:1;box-shadow:0 6px 18px rgba(255,46,121,.55);
  transform:translateY(-7px);display:grid;place-items:center;
}

.full-reader{
  position:fixed;inset:0;z-index:130;background:#1a0b17;color:#ff69b4;
  display:none;flex-direction:column;user-select:none;
}
.full-reader.open{display:flex}
.fr-top{
  position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px 8px;
}
.fr-circle{
  width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,105,180,.35);
  background:rgba(0,0,0,.4);color:#ff69b4;font-size:1.25rem;cursor:pointer;
  display:grid;place-items:center;
}
.fr-scroll{
  flex:1;overflow-y:auto;padding:8px 18px 24px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.fr-card{
  position:relative;width:100%;max-width:440px;min-height:500px;border-radius:26px;
  background-size:cover;background-position:center;padding:38px 24px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  box-shadow:0 18px 44px rgba(0,0,0,.55);
}
.fr-card::before{
  content:"";position:absolute;inset:14px;border:1px solid rgba(255,105,180,.4);
  border-radius:18px;pointer-events:none;
}
.fr-cat-pill{
  position:relative;z-index:2;background:rgba(0,0,0,.5);border:1px solid rgba(255,105,180,.5);
  color:#ff85bc;padding:5px 16px;border-radius:20px;font-size:.92rem;font-weight:600;
  margin-bottom:24px;
}
.fr-quote-mark{position:relative;z-index:2;font-size:2rem;color:#ff4d94;line-height:1;margin-bottom:10px}
.fr-text{
  position:relative;z-index:2;margin:0 0 24px;font-family:"Tiro Devanagari Hindi",serif;
  font-size:clamp(1.45rem,6vw,2rem);line-height:1.75;white-space:pre-line;
  color:#ff69b4;text-shadow:0 2px 10px rgba(0,0,0,.82);
}
.fr-sig{position:relative;z-index:2;font-size:1rem;color:#ff9ecd;letter-spacing:.04em}

.studio,.modal{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column;overflow-y:auto}
.studio.open,.modal.open{display:flex}
.st-head{background:var(--g);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;position:sticky;top:0;z-index:5}
.st-head h3{margin:0;font-size:1.15rem;font-weight:600}
.st-nav{background:none;border:0;color:#fff;font-size:1.35rem;cursor:pointer;padding:4px 8px}

.st-step{flex:1;display:none;flex-direction:column}
.st-step.active{display:flex}
.compose-area{flex:1;min-height:220px;width:100%;border:0;outline:none;resize:none;padding:20px;font-family:"Tiro Devanagari Hindi",serif;font-size:1.25rem;line-height:1.7;background:var(--card);color:var(--accent)}
.compose-foot{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-top:1px solid var(--line);background:var(--card);color:var(--soft);font-size:.9rem}

.design-stage{background:var(--chip);padding:14px;display:grid;place-items:center;min-height:260px}
.design-card{width:100%;max-width:360px;min-height:240px;border-radius:16px;position:relative;background-size:cover;background-position:center;padding:24px 20px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 10px 26px rgba(255,46,121,.2)}
.design-card p{margin:0 0 12px;font-family:"Tiro Devanagari Hindi",serif;font-size:1.2rem;line-height:1.6;white-space:pre-line}
.design-card .d-sig{font-size:.88rem;opacity:.92}
.design-card .wm{position:absolute;left:14px;bottom:10px;font-size:.75rem;opacity:.85}

.st-tabs{display:flex;border-bottom:1px solid var(--line);background:var(--card)}
.st-tabs button{flex:1;padding:12px;background:none;border:0;border-bottom:3px solid transparent;font:inherit;font-weight:600;color:var(--soft);cursor:pointer}
.st-tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
.st-panel{padding:14px;display:grid;gap:12px;background:var(--card)}
.wall-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wall-tile{height:64px;border-radius:12px;border:2px solid transparent;background-size:cover;background-position:center;cursor:pointer;display:grid;place-items:center;font-size:.75rem;font-weight:600;color:var(--accent);background-color:var(--chip);text-align:center}
.wall-tile.active{border-color:var(--accent)}
.ctrl-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctrl-row select,.ctrl-row input{flex:1;min-width:120px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--accent);font:inherit}
.swatch{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);cursor:pointer}

.share-box{padding:16px;display:grid;gap:12px;max-width:480px;margin:0 auto;width:100%}
.share-box input,.share-box select,.modal-body input,.modal-body textarea,.modal-body select{
  width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);
  background:var(--card);color:var(--accent);font:inherit;
}
.cat-add-row{display:flex;gap:8px;align-items:center}
.cat-add-row input{flex:1}
.cat-add-row button{background:var(--chip);color:var(--accent);border:1px solid var(--accent);border-radius:14px;padding:10px 12px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}

.pub-btn{background:var(--g);color:#fff;border:0;border-radius:24px;padding:13px;font:inherit;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 8px 22px -6px rgba(255,46,121,.65)}
.share-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sh-tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;font:inherit;font-weight:600;color:var(--accent);cursor:pointer;text-align:center}

.modal-body{padding:16px;display:grid;gap:12px;max-width:520px;margin:0 auto;width:100%}
.ava-preview-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.ava-big{width:54px;height:54px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-size:1.3rem;font-weight:700;overflow:hidden;flex:0 0 auto}
.ava-big img{width:100%;height:100%;object-fit:cover;display:block}
.type-row{display:flex;gap:8px}
.type-row button{flex:1;padding:9px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--accent);font:inherit;font-weight:600;cursor:pointer}
.type-row button.active{background:var(--g);color:#fff;border-color:transparent}

.notif-item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:.9rem;color:var(--accent)}
.notif-item b{color:var(--accent)}

.empty{text-align:center;color:var(--soft);padding:36px 12px}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#241238;color:#fff;padding:9px 18px;border-radius:20px;font-size:.88rem;z-index:999;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="wrap">
  <header class="top-header">
    <div class="brand-block" id="brandBtn" title="टैप करने पर रिफ्रेश होगा | 3 बार टैप करने पर संख्या दिखेगी">
      <div class="brand">शायरी</div>
      <p class="tagline">दिल की बात, शायरी के साथ ✨</p>
    </div>
    <div class="top-icons">
      <button class="t-icon" id="topSearchBtn" type="button" aria-label="Search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.5" y2="16.5"/></svg>
      </button>
      <button class="t-icon" id="topBellBtn" type="button" aria-label="Notifications">
        <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </button>
      <button class="t-icon" id="topShareBtn" type="button" aria-label="Share / Install / Download">
        <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      </button>
      <button class="t-icon moon" id="themeBtn" type="button" aria-label="Theme">
        <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="t-icon grid-btn" id="topCatGridBtn" type="button" aria-expanded="false" aria-label="All Categories">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
      </button>
    </div>
  </header>

  <div class="chips" id="chips"></div>

  <section class="cat-drawer" id="catDrawer">
    <div class="cat-drawer-head">
      <span>सभी श्रेणियाँ चुनें</span>
      <button type="button" id="closeCatDrawer" style="background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer">बंद करें ✕</button>
    </div>
    <div class="cat-grid" id="catGrid"></div>
  </section>

  <div class="story-strip" id="storyStrip"></div>

  <div class="search-wrap" id="searchWrap">

function compressImage(dataUrl,maxSide,quality,cb){
  const im=new Image();
  im.onload=()=>{
    const cv=document.createElement("canvas");
    const sc=Math.min(1,(maxSide||720)/Math.max(im.width,im.height));
    cv.width=Math.max(1,im.width*sc);
    cv.height=Math.max(1,im.height*sc);
    cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
    cb(cv.toDataURL("image/jpeg",quality||0.72));
  };
  im.src=dataUrl;
}

const fl=n=>rnd(n,(a,b,i)=>{const x=a*400|0,y=190+(b*100|0),r=3+(b*6|0),c=['#ff5d8f','#ffd93d','#ffffff','#ff9ad5','#c77dff'][i%5];return `<line x1='${x}' y1='${y}' x2='${x}' y2='${y+14}' stroke='#2f6b2a' stroke-width='1.5'/><circle cx='${x}' cy='${y}' r='${r}' fill='${c}'/><circle cx='${x}' cy='${y}' r='${(r/3).toFixed(1)}' fill='#7a3e00'/>`});

function wallUrl(idx,customImg){
  if(customImg)return `linear-gradient(rgba(0,0,0,.22),rgba(0,0,0,.42)),url("${customImg}")`;
  const w=WALLS[idx%WALLS.length]||WALLS[0];
  const ov=w.dark?'linear-gradient(rgba(0,0,0,.12),rgba(0,0,0,.38))':'linear-gradient(rgba(0,0,0,.18),rgba(0,0,0,.34))';
  return `${ov},url("data:image/svg+xml,${encodeURIComponent(w.svg)}")`;
}

function saveShayariImage(post,idx){
  const wIdx=post.b!=null?post.b:((idx||0)%WALLS.length);
  const wObj=WALLS[wIdx]||WALLS[0];
  const col=post.col||"#ff69b4";
  const cv=document.createElement("canvas");
  cv.width=1080;cv.height=1080;
  const ctx=cv.getContext("2d");
  const im=new Image();
  im.onload=()=>{
    ctx.drawImage(im,0,0,1080,1080);
    ctx.fillStyle="rgba(0,0,0,.32)";
    ctx.fillRect(0,0,1080,1080);
    ctx.strokeStyle="rgba(255,105,180,.45)";
    ctx.lineWidth=4;
    ctx.strokeRect(48,48,984,984);

    ctx.fillStyle="#ff9ecd";
    ctx.font="600 34px 'Hind',sans-serif";
    ctx.textAlign="center";
    ctx.fillText("✦ "+(post.c||"शायरी")+" ✦",540,180);

    ctx.fillStyle=col;
    ctx.font="600 50px 'Tiro Devanagari Hindi',serif";
    const lines=(post.t||"").split("\n");
    const lh=78;
    const startY=540-((lines.length-1)*lh)/2;
    lines.forEach((ln,i)=>ctx.fillText(ln,540,startY+i*lh));

    ctx.fillStyle="#ff85bc";
    ctx.font="500 32px 'Hind',sans-serif";
    ctx.fillText("— _ "+(post.n||"शायरी")+" —",540,920);

    const a=document.createElement("a");
    a.download="shayari-"+Date.now()+".png";
    a.href=cv.toDataURL("image/png");
    a.click();
    toast("इमेज सेव/डाउनलोड हो गई 🖼️");
  };
  im.src=post.img||("data:image/svg+xml;charset=utf-8,"+encodeURIComponent(wObj.svg));
}

function openReader(postsArr,startIndex){
  if(!postsArr||!postsArr.length)return;
  readerList=postsArr;
  readerIdx=Math.max(0,Math.min(startIndex||0,postsArr.length-1));
  renderReaderItem();
  $("fullReader").classList.add("open");
}

function renderReaderItem(){
  const p=readerList[readerIdx];
  if(!p)return;
  const wIdx=p.b!=null?p.b:(readerIdx%WALLS.length);
  const wObj=WALLS[wIdx]||WALLS[0];
  const col=p.col||"#ff69b4";

  const card=$("frCard");
  card.style.backgroundImage=wallUrl(wIdx,p.img);
  card.style.color=col;

  $("frCat").textContent="✦ "+(p.c||"शायरी")+" ✦";
  const ft=$("frText");
  ft.textContent=p.t||"";
  ft.style.fontFamily=(p.f||"Tiro Devanagari Hindi")+",serif";
  ft.style.color=col;
  $("frSig").textContent="— _ "+(p.n||"शायरी")+" —";
  $("frLike").textContent=myL[p.id]?"❤️":"♡";
  $("frScroll").scrollTop=0;
}

(()=>{
  $("frBack").onclick=()=>$("fullReader").classList.remove("open");
  $("frLike").onclick=()=>{
    const p=readerList[readerIdx];
    if(!p)return;
    if(myL[p.id])delete myL[p.id];else myL[p.id]=1;
    setS("sh_l",myL);
    $("frLike").textContent=myL[p.id]?"❤️":"♡";
    renderFeed();
    toast(myL[p.id]?"पसंद किया गया ❤️":"पसंद हटाया गया");
  };

  let lpTimer=null,sx=0,sy=0;
  const sc=$("frScroll");
  sc.addEventListener("touchstart",e=>{
    if(!e.touches||!e.touches.length)return;
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;
    clearTimeout(lpTimer);
    lpTimer=setTimeout(()=>{
      const p=readerList[readerIdx];
      if(p&&confirm("इस शायरी इमेज को Download / Save करना चाहते हैं?")){
        saveShayariImage(p,readerIdx);
      }
    },650);
  },{passive:true});

  sc.addEventListener("touchmove",e=>{
    if(!e.touches||!e.touches.length)return;
    if(Math.abs(e.touches[0].clientX-sx)>12||Math.abs(e.touches[0].clientY-sy)>12){
      clearTimeout(lpTimer);
    }
  },{passive:true});

  sc.addEventListener("touchend",e=>{
    clearTimeout(lpTimer);
    if(!e.changedTouches||!e.changedTouches.length||!readerList.length)return;
    const dx=e.changedTouches[0].clientX-sx;
    const dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.2){
      if(dx<0)readerIdx=(readerIdx+1)%readerList.length;
      else readerIdx=(readerIdx-1+readerList.length)%readerList.length;
      renderReaderItem();
    }
  },{passive:true});
})();

function timeAgo(ts){
  if(!ts)return "संग्रह";
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60)return "अभी";
  if(s<3600)return Math.floor(s/60)+" मिनट पहले";
  if(s<86400)return Math.floor(s/3600)+" घंटे पहले";
  return Math.floor(s/86400)+" दिन पहले";
}

function canEditOrDelete(p){

}

async function toggleLike(id,el){
  const was=!!myL[id];
  if(was)delete myL[id];else myL[id]=1;
  setS("sh_l",myL);
  if(isLive&&db){
    const ref=db.collection("shayari_interactions").doc(id);
    try{
      await db.runTransaction(async tx=>{
        const snap=await tx.get(ref);
        const cur=(snap.exists&&snap.data().likes)?snap.data().likes:0;
        tx.set(ref,{likes:Math.max(0,cur+(was?-1:1))},{merge:true});
      });
    }catch(e){}
  }else updatePostCard(el);
}

async function addComment(id,txt,el){
  const who=myProfile.name||"पाठक";
  if(isLive&&db){
    try{await db.collection("shayari_comments").add({pid:id,who,t:txt,ts:Date.now()})}catch(e){toast("कमेंट नहीं हो पाया")}
  }else{
    (myC[id]=myC[id]||[]).push({who,t:txt,ts:Date.now()});
    setS("sh_c",myC);updatePostCard(el);
  }
}

function getFilteredPosts(){
  let posts=allPosts();
  if(viewMode==="saved"){
    posts=posts.filter(p=>!!myS[p.id]||!!myL[p.id]);
  }else if(viewMode==="profile"){
    const me=(myProfile.name||"").toLowerCase();
    posts=cachedPosts.filter(p=>!me||(p.n||"").toLowerCase()===me);
  }else if(curCat!=="सभी"){
    posts=posts.filter(p=>p.c===curCat);
  }
  if(searchQ.trim()){
    const q=searchQ.toLowerCase().replace(/^#+/,"").trim();
    posts=posts.filter(p=>((p.t||"")+" "+(p.c||"")+" "+(p.n||"")+" "+(p.h||"")).toLowerCase().includes(q));
  }
  return posts;
}

function shareText(txt,shareUrl){
  const payload={title:"शायरी",text:txt};
  if(shareUrl&&/^https?:\/\//i.test(shareUrl))payload.url=shareUrl;
  const copyFallback=()=>{
    const full=shareUrl?`${txt}\n${shareUrl}`:txt;
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(full).then(()=>toast("लिंक/शायरी कॉपी हो गई ✨")).catch(()=>{});
      return;
    }
    const ta=document.createElement("textarea");
    ta.value=full;document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");toast("कॉपी हो गया ✨")}catch(e){toast("शेयर तैयार है")}
    ta.remove();
  };
  if(navigator.share){
    navigator.share(payload).catch(err=>{
      if(!err||err.name!=="AbortError")copyFallback();
    });
  }else{
    copyFallback();
  }
}

    const r=document.documentElement;
    r.dataset.theme=r.dataset.theme==="dark"?"light":"dark";
  };

  $("topCatGridBtn").onclick=()=>{
    const dr=$("catDrawer");
    const open=dr.classList.toggle("open");
    $("topCatGridBtn").setAttribute("aria-expanded",String(open));
    renderCatGrid();
  };
  $("closeCatDrawer").onclick=()=>{
    $("catDrawer").classList.remove("open");
    $("topCatGridBtn").setAttribute("aria-expanded","false");
  };

  $("jumpTop").onclick=()=>window.scrollTo({top:0,behavior:"smooth"});
  $("jumpBottom").onclick=()=>window.scrollTo({top:document.documentElement.scrollHeight,behavior:"smooth"});
})();

if(isLive&&db){
  db.collection("shayari_posts").orderBy("ts","desc").limit(250).onSnapshot(snap=>{
    const incoming=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
    if(incoming.length){
      cachedPosts=incoming;
      setS("sh_cached_posts",cachedPosts);
      renderStoryStrip();renderChips();renderFeed();
    }
  },()=>{});

  db.collection("shayari_interactions").onSnapshot(snap=>{
    snap.docs.forEach(d=>{liveLikes[d.id]=(d.data()||{}).likes||0});
    document.querySelectorAll(".post").forEach(updatePostCard);
  },()=>{});

  db.collection("shayari_comments").orderBy("ts","asc").onSnapshot(snap=>{
    Object.keys(liveComms).forEach(k=>delete liveComms[k]);
    snap.docs.forEach(d=>{const v=d.data()||{};if(v.pid)(liveComms[v.pid]=liveComms[v.pid]||[]).push(v)});
    document.querySelectorAll(".post").forEach(updatePostCard);
  },()=>{});
}

function updateNav(){
  $("navHome").classList.toggle("active",viewMode==="home");
  $("navSaved").classList.toggle("active",viewMode==="saved");
  $("navProfile").classList.toggle("active",viewMode==="profile");
}

$("navHome").onclick=()=>{closeAllModalsOnStart();location.reload()};
$("navSearch").onclick=()=>{
  const sw=$("searchWrap");sw.classList.toggle("open");
  if(sw.classList.contains("open"))$("qInp").focus();
};
$("navPlus").onclick=()=>openStudio();
$("navSaved").onclick=()=>{viewMode="saved";updateNav();renderChips();renderFeed()};
$("navProfile").onclick=()=>{viewMode="profile";updateNav();renderChips();renderFeed();openAccountModal()};

$("qInp").oninput=e=>{searchQ=e.target.value;renderFeed()};
$("qClr").onclick=()=>{$("qInp").value="";searchQ="";renderFeed()};
$("nextHero").onclick=pickHero;

(()=>{
  let taps=0,tm=null;
  $("brandBtn").onclick=()=>{
    taps++;
    clearTimeout(tm);
    if(taps>=3){
      taps=0;OWN=!OWN;setS("sh_owner",OWN?"1":"0");renderChips();renderFeed();
      toast(OWN?"संख्या दिख रही है 📊":"संख्या छिप गई है");
      return;
    }
    tm=setTimeout(()=>{
      if(taps===1){taps=0;closeAllModalsOnStart();location.reload()}
      else taps=0;
    },320);
  };
})();

renderStoryStrip();
renderChips();
pickHero();
renderFeed();
</script>
</body>
</html>
